version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(GEMINI|STRIPE_|SUPABASE_|NEXT_PUBLIC_SUPABASE_|NEXT_PUBLIC_LAMBDA_|NEXT_PUBLIC_STRIPE_|NEXT_PUBLIC_APP_URL)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
